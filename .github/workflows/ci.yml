name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Unit tests (KanbanKit) + build
        run: |
          set -o pipefail
          xcodebuild test \
            -project Fleet.xcodeproj -scheme Fleet \
            -destination 'platform=macOS' \
            -only-testing:KanbanKitTests \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: fleet-bridge MCP protocol test
        run: |
          set -euo pipefail
          # Derive the built products path robustly instead of hardcoding a
          # DerivedData hash directory (we do pin -derivedDataPath, but still
          # locate the binary via find rather than assuming Debug/ layout).
          BRIDGE="$(find build/dd/Build/Products -type f -name fleet-bridge -not -path '*.app/*' -perm +111 | head -1)"
          if [ -z "$BRIDGE" ]; then
            echo "::error::fleet-bridge binary not found under build/dd/Build/Products"
            exit 1
          fi
          echo "Using fleet-bridge at: $BRIDGE"
          bash scripts/test-bridge.sh "$BRIDGE"
